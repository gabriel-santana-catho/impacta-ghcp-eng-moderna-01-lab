name: Passo 3 - apos especificacao

on:
  issue_comment:
    types: [created]

permissions:
  actions: write
  contents: read
  issues: write

env:
  STEP_TRIGGER_PHRASE: especificado

jobs:
  progress_lab:
    if: >-
      ${{ !github.event.repository.is_template
      && !github.event.issue.pull_request
      && contains(github.event.issue.title, 'Lab: ') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Avançar lab
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash .github/scripts/progress-step.sh \
            "${{ github.repository }}" \
            "${{ github.event.issue.number }}" \
            "${{ github.event.comment.body }}" \
            "${{ env.STEP_TRIGGER_PHRASE }}" \
            "${{ github.workflow }}" \
            "04-apos-instrucoes.yml" \
            ".github/steps/03-ajustar-instrucoes.md" \
            "A necessidade resumida agora possui limites, contratos e critérios observáveis. Essa especificação reduz decisões acidentais durante a geração de código e permite avaliar o resultado por comportamento. Antes da implementação, ainda precisamos impedir que o contexto durável privilegie apenas a especificação antiga." \
            "Para avançar, aprove a especificação e comente \`${{ env.STEP_TRIGGER_PHRASE }}\`." \
            "next"
