name: Passo 7 - encerrar lab

on:
  issue_comment:
    types: [created]

permissions:
  actions: write
  contents: read
  issues: write

env:
  STEP_TRIGGER_PHRASE: validado

jobs:
  finish_lab:
    if: >-
      ${{ !github.event.repository.is_template
      && !github.event.issue.pull_request
      && contains(github.event.issue.title, 'Lab: ') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Encerrar lab
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash .github/scripts/progress-step.sh \
            "${{ github.repository }}" \
            "${{ github.event.issue.number }}" \
            "${{ github.event.comment.body }}" \
            "${{ env.STEP_TRIGGER_PHRASE }}" \
            "${{ github.workflow }}" \
            "" \
            "" \
            "A equipe relacionou especificação, implementação e evidências antes de encerrar. Esse fechamento é o que transforma uma geração plausível em uma entrega supervisionada e reproduzível." \
            "Para encerrar, reúna as evidências e comente \`${{ env.STEP_TRIGGER_PHRASE }}\`." \
            "final" \
            ".github/steps/07-encerramento.md"
