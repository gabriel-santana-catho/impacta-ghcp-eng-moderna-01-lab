name: Passo 6 - apos interface

on:
  issue_comment:
    types: [created]

permissions:
  actions: write
  contents: read
  issues: write

env:
  STEP_TRIGGER_PHRASE: integrado

jobs:
  progress_lab:
    if: >-
      ${{ !github.event.repository.is_template
      && !github.event.issue.pull_request
      && contains(github.event.issue.title, 'Lab: ') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Avançar lab
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash .github/scripts/progress-step.sh \
            "${{ github.repository }}" \
            "${{ github.event.issue.number }}" \
            "${{ github.event.comment.body }}" \
            "${{ env.STEP_TRIGGER_PHRASE }}" \
            "${{ github.workflow }}" \
            "07-encerrar-lab.yml" \
            ".github/steps/06-validar-entrega.md" \
            "A nova página fecha a jornada da lista de treinamentos até o cadastro e a consulta de inscritos, incluindo estados de sucesso e falha. A validação no navegador é importante, mas ainda precisa ser relacionada às garantias automatizadas e ao contrato aprovado." \
            "Para avançar, valide o fluxo pela interface e comente \`${{ env.STEP_TRIGGER_PHRASE }}\`." \
            "next"
