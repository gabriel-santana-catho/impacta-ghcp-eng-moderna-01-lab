name: Passo 4 - apos instrucoes

on:
  issue_comment:
    types: [created]

permissions:
  actions: write
  contents: read
  issues: write

env:
  STEP_TRIGGER_PHRASE: contextualizado

jobs:
  progress_lab:
    if: >-
      ${{ !github.event.repository.is_template
      && !github.event.issue.pull_request
      && contains(github.event.issue.title, 'Lab: ') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Avançar lab
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash .github/scripts/progress-step.sh \
            "${{ github.repository }}" \
            "${{ github.event.issue.number }}" \
            "${{ github.event.comment.body }}" \
            "${{ env.STEP_TRIGGER_PHRASE }}" \
            "${{ github.workflow }}" \
            "05-apos-api-persistencia.yml" \
            ".github/steps/04-implementar-api-persistencia.md" \
            "As instruções agora ensinam o Copilot a selecionar o contexto relevante sem duplicar regras de produto. Isso evita que a primeira especificação seja aplicada indevidamente a toda mudança futura. Com processo e contrato separados, a equipe pode implementar a fatia transversal." \
            "Para avançar, revise as instructions e comente \`${{ env.STEP_TRIGGER_PHRASE }}\`." \
            "next"
